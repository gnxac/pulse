name: Publicar site

# Publica a pasta www/ no GitHub Pages a cada push na main.
# Ative uma vez: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/publicar-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # www/index.php é do Laravel (migração em andamento); o site antigo é só estático.
      - run: rm -f www/index.php
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
