# O mime.types do nginx não conhece .webmanifest; sem isto sai application/octet-stream.
location ~* \.webmanifest$ {
    default_type application/manifest+json;
    try_files $uri =404;
}

# A imagem já define `charset utf-8;`, mas o nginx só aplica em text/html, text/xml, text/plain e application/javascript.
# Aqui estendemos para CSS, JSON, manifesto e SVG.
charset_types text/html text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;
