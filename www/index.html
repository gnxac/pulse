<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338A8">
  <title>Pulse</title>
  <link rel="icon" href="img/icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/sim.css">
</head>
<body class="logged-out">
  <div class="shell">
    <aside class="rail" aria-label="Navegação principal">
      <div class="brand"><b>Pulse</b></div>
      <nav class="nav" id="nav">
        <a href="#/inicio" data-route="inicio"><span class="ic-slot"><span data-icon="home"></span></span><span class="lbl"><span class="l-f">Início</span></span><kbd class="hint">Ctrl 1</kbd></a>
        <a href="#/questoes" data-route="questoes"><span class="ic-slot"><span data-icon="search"></span></span><span class="lbl"><span class="l-f">Questões</span></span><kbd class="hint">Ctrl 2</kbd></a>
        <a href="#/listas" data-route="listas"><span class="ic-slot"><span data-icon="folder"></span></span><span class="lbl"><span class="l-f">Listas</span></span><kbd class="hint">Ctrl 3</kbd></a>
        <a href="#/anotacoes" data-route="anotacoes"><span class="ic-slot"><span data-icon="notes"></span></span><span class="lbl"><span class="l-f">Anotações</span></span><kbd class="hint">Ctrl 4</kbd></a>
        <a href="#/desempenho" data-route="desempenho" aria-label="Desempenho" title="Desempenho"><span class="ic-slot"><span data-icon="chart"></span></span><span class="lbl"><span class="l-r">Desemp.</span><span class="l-f">Desempenho</span></span><kbd class="hint">Ctrl 5</kbd></a>
        <a href="#/configuracoes" data-route="configuracoes" aria-label="Configurações" title="Configurações"><span class="ic-slot"><span data-icon="settings"></span></span><span class="lbl"><span class="l-s">Ajustes</span><span class="l-f">Configurações</span></span><kbd class="hint">Ctrl 6</kbd></a>
      </nav>
      <div class="rail-foot">
        <div class="sync-pill" role="status" aria-label="Salvamento: Salvo"><span class="sync-dot on"></span><span class="sync-label">Salvo</span><span class="sync-short">Salvo</span></div>
        <button type="button" class="btn sm save-retry" data-save-retry hidden>Tentar de novo</button>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/dedupe.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/marker.js"></script>
  <script src="js/solve.js"></script>
  <script src="js/lists.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/perf.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/home.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
